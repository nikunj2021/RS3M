name: Weekly NSE Market Report

on:
  schedule:
    - cron: '37 2 * * 6'
  workflow_dispatch:

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        # Added google-api-python-client and google-auth
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance xlsxwriter google-api-python-client google-auth

      - name: Run Market Reports
        # Pass the Google Service Account JSON secret to the scripts
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python RS-NIFTY504W.py
          python RS-NIFTY2504W.py
          python RS-NIFTY5004W.py

      - name: Commit and Push Local Copies (Optional)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Report/
          git commit -m "Auto-update weekly market perception reports" || echo "No changes to commit"
          git push
